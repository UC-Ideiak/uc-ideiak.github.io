<!doctype html>
<html class="h-full" lang="es">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/assets/UC_logo-BfeqoW-k.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UC Ideiak | Acceso Clientes</title>
  <script type="module" crossorigin src="/assets/main-D3CVBbD3.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/main-CDMVueYP.css">
</head>

<body class="min-h-screen bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900">

  <nav class="h-20 w-[375px] m-auto pt-4 flex justify-between items-center md:w-[80%] md:h-40">
    <a href="/">
      <img class="size-40 pt-4 md:size-50 hover:scale-105 transition-transform duration-200" src="/assets/UC_brand-p_adcYyE.png" alt="Logo de UC Ideiak">
    </a>
    <a href="/login.html">
      <button
        class="hidden border-2 border-orange-400 font-semibold rounded-3xl cursor-pointer bg-orange-500 hover:bg-orange-600 hover:border-orange-500 w-[100px] py-1 text-xs text-white shadow-lg hover:shadow-orange-500/30 transition-all duration-200">Área
        Cliente</button>
    </a>
  </nav>

  <div class="flex min-h-full flex-col justify-center px-6 py-12 lg:px-8">
    <div class="sm:mx-auto sm:w-full sm:max-w-sm">
      <h2 class="mt-10 text-center text-3xl font-bold tracking-tight text-white">Accede a tu cuenta</h2>
      <p class="mt-2 text-center text-sm text-slate-400">Gestión de proyectos y documentación</p>
    </div>

    <div class="mt-10 sm:mx-auto sm:w-full sm:max-w-sm">
      <form class="space-y-6">
        <div>
          <label for="email" class="block text-sm font-medium text-slate-300">Correo electrónico</label>
          <div class="mt-2">
            <input id="email" type="email" name="email" required autocomplete="email"
              class="block w-full rounded-lg bg-slate-800/50 px-4 py-3 text-base text-white outline-none placeholder:text-slate-500 focus:ring-2 focus:ring-orange-500 focus:bg-slate-800/70 border border-slate-700 transition-all duration-200" />
          </div>
        </div>

        <div>
          <div class="flex items-center justify-between">
            <label for="password" class="block text-sm font-medium text-slate-300">Contraseña</label>
            <div class="hidden text-sm">
              <a href="#" class="font-semibold text-orange-400 hover:text-orange-300 transition-colors duration-200">No me acuerdo</a>
            </div>
          </div>
          <div class="mt-2">
            <input id="password" type="password" name="password" required autocomplete="current-password"
              class="block w-full rounded-lg bg-slate-800/50 px-4 py-3 text-base text-white outline-none placeholder:text-slate-500 focus:ring-2 focus:ring-orange-500 focus:bg-slate-800/70 border border-slate-700 transition-all duration-200" />
          </div>
        </div>

        <div>
          <a href="/no_login.html" role="button"
            class="border-2 border-orange-400 font-semibold flex w-full justify-center rounded-lg bg-orange-500 px-4 py-3 text-sm text-white hover:bg-orange-600 hover:border-orange-500 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-orange-500 cursor-pointer shadow-lg hover:shadow-orange-500/30 transition-all duration-200">
            Entrar
          </a>
        </div>
      </form>
    </div>
  </div>

  <footer class="fixed bottom-0 left-0 right-0 flex md:border-t border-orange-600 bg-slate-900/80 backdrop-blur-sm">
    <p class="mx-auto font-semibold text-xs text-orange-400 py-4">
      © 2023 UC Ideiak. Derechos reservados.
    </p>
  </footer>
</body>

</html>
